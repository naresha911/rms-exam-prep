<style>
        .tactile-button {
            border-bottom-width: 4px;
            border-color: #2f2ebe; /* on-primary-fixed-variant */
            transition: transform 0.1s, border-bottom-width 0.1s;
        }
        .tactile-button:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
        
        .option-card {
            border: 1px solid #c7c4d7; /* outline-variant */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease;
        }
        .option-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }
        .option-card.selected {
            background-color: #e1e0ff; /* primary-fixed */
            border: 2px solid #4648d4; /* primary */
            box-shadow: inset 0 0 10px rgba(70, 72, 212, 0.1);
        }
        .option-card.selected .check-circle {
            background-color: #4648d4;
            color: #ffffff;
            border-color: #4648d4;
        }

<main class="flex-grow flex flex-col items-center px-margin-mobile pb-24 md:px-margin-desktop md:max-w-4xl md:mx-auto w-full">

<!-- Chat Bubble -->
<div class="absolute -right-4 top-4 bg-surface-container-lowest border border-outline-variant rounded-2xl rounded-bl-none p-3 shadow-md z-20 max-w-[140px]">

                This helps us customize your mission briefings and mock tests.

<!-- Selection Cards -->
<div class="w-full flex flex-col space-y-4 md:space-y-0 md:grid md:grid-cols-3 md:gap-4 w-full max-w-2xl">
<!-- Option 1: Class 5 -->

                Continue Mission
                <span class="material-symbols-outlined ml-2" data-icon="arrow_forward" data-weight="bold">arrow_forward</span>
</button>
</div>

<script>
        function selectOption(selectedElement) {
            // Remove 'selected' class and hide checks from all options
            const options = document.querySelectorAll('.option-card');
            options.forEach(opt => {
                opt.classList.remove('selected');
                const check = opt.querySelector('.check-circle span');
                if(check) check.classList.add('hidden');
            });

            // Add 'selected' class and show check to the clicked option
            selectedElement.classList.add('selected');
            const check = selectedElement.querySelector('.check-circle span');
            if(check) check.classList.remove('hidden');

            // Enable Continue button
            const continueBtn = document.getElementById('continueBtn');
            continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            continueBtn.removeAttribute('disabled');
        }
    </script>
