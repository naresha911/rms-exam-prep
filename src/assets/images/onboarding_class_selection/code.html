<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Top Nav (Transactional, suppressed Bottom Nav) -->

<div class="w-full max-w-4xl flex items-center justify-between">

</div>
<img alt="Cadet Vijay, a friendly Indian kid mascot in an Army uniform thinking" class="w-48 h-48 object-contain drop-shadow-md mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3RI6xr7a-X1oIVXsAh2HHNRlU5dGueD0iZ8KQol_leLqLghjRibhI02N6GRYSPlfH_Y91B3tUUrIwxBSrZCLnBl48dKWiTFTKkY7GSpUZJS63r3iUVSExJd8BsF9luGGgIj7l6nMlZAjhiZHb_cPZ5csdWAB3x7rW9feIW-qji4Dt_6buwsfxCiXkyRbypDtZrEFW6_Gt3g4V-LPIrtp8rZsHLAOrOuMYvNvCcu7I0vWXIgTD6cVv"/>
</div>
<!-- Selection Cards (Bento-style stack) -->
<div class="w-full max-w-md flex flex-col gap-stack-md" id="class-selection-container">
<!-- Option 1: Class 6 -->
<button class="group relative w-full bg-surface border border-outline-variant rounded-xl p-6 text-left transition-all duration-200 card-shadow hover:-translate-y-1 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" data-class="6" onclick="selectClass(this); setTimeout(() =&gt; window.location.href='{{DATA:SCREEN:SCREEN_15}}', 300)">
<div class="flex items-center justify-between">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary" data-icon="school">school</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Class 6</h2>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Admission to VI</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center group-[.selected]:border-primary group-[.selected]:bg-primary transition-colors">
<span class="material-symbols-outlined text-white text-sm opacity-0 group-[.selected]:opacity-100" data-icon="check">check</span>
</div>

<!-- Selection Highlight Overlay (Hidden by default) -->

                Continue
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</a>

<script>
        function selectClass(selectedButton) {
            // Remove 'selected' class from all buttons
            const buttons = document.querySelectorAll('#class-selection-container button');
            buttons.forEach(btn => btn.classList.remove('selected'));
            
            // Add 'selected' class to the clicked button
            selectedButton.classList.add('selected');

            // Enable the continue button
            const continueBtn = document.getElementById('continue-btn');
            continueBtn.disabled = false;
            continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            // Optional: Add a slight scale animation on select
            selectedButton.style.transform = 'scale(0.98)';
            setTimeout(() => {
                selectedButton.style.transform = '';
            }, 100);
        }
    </script>
