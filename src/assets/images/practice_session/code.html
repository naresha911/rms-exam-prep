            border-bottom-width: 0px;

        /* Radio input hiding for custom cards */
        input[type="radio"].mcq-radio {
            display: none;
        }
        
        /* Card States */
        .mcq-card {
            transition: all 0.2s ease;

        .mcq-radio:checked + .mcq-card {

<input class="mcq-radio" name="answer" type="radio" value="A"/>
<div class="mcq-card w-full flex items-center p-stack-md bg-surface-container-lowest border-2 border-outline-variant rounded-xl group-hover:border-primary group-hover:bg-surface-container shadow-sm min-h-touch-target">

<label class="cursor-pointer relative w-full group">
<input class="mcq-radio" name="answer" type="radio" value="B"/>
<div class="mcq-card w-full flex items-center p-stack-md bg-surface-container-lowest border-2 border-outline-variant rounded-xl group-hover:border-primary group-hover:bg-surface-container shadow-sm min-h-touch-target">

            </button>
<button class="flex-[2] bg-primary text-on-primary font-label-lg text-label-lg rounded-xl h-touch-target md:h-14 flex items-center justify-center btn-3d border-on-primary-fixed-variant disabled:opacity-50 disabled:cursor-not-allowed disabled:border-b-4 disabled:transform-none transition-all" disabled="" id="submit-btn">
                Submit Mission
            </button>

<!-- Mobile Navigation Shell - Suppressed because this is a transactional/focused task screen -->
<!-- The prompt indicated a linear/task focused state, so bottom nav is intentionally omitted based on instructions. -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('mcq-form');
            const submitBtn = document.getElementById('submit-btn');
            const radios = document.querySelectorAll('.mcq-radio');

            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (form.querySelector('input[name="answer"]:checked')) {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                });
            });

            submitBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const selected = form.querySelector('input[name="answer"]:checked');
                if (selected) {
                    // Simple interaction feedback
                    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2" data-icon="sync">sync</span> Validating...';
                    setTimeout(() => {
                        submitBtn.innerHTML = 'Next Mission <span class="material-symbols-outlined ml-2" data-icon="arrow_forward">arrow_forward</span>';
                        submitBtn.classList.remove('bg-primary', 'border-on-primary-fixed-variant');
                        submitBtn.classList.add('bg-success-green', 'border-green-800');
                    }, 800);
                }
            });
        });
    </script>
